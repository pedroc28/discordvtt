# Roda lint, build e testes do app, o teste das regras do servidor e os testes do app contra o
# servidor de teste em todo pull request e em todo push na main. O nome do job (verificar) é o que
# scripts/entregar.sh espera antes de juntar, por isso os testes do servidor são etapas deste job,
# e não jobs à parte.
name: Verificar

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # Sobe um PocketBase da versão fixa com as migrações e hooks do repositório e confere
      # quem vê, cria, altera e apaga o quê (ver pocketbase/testar-regras.mjs).
      - name: Testar as regras do servidor
        working-directory: .
        run: |
          VERSAO="$(cat pocketbase/VERSAO)"
          ARQUIVO="pocketbase_${VERSAO}_linux_amd64.zip"
          ENDERECO="https://github.com/pocketbase/pocketbase/releases/download/v${VERSAO}"
          curl -fsSL -o "$RUNNER_TEMP/$ARQUIVO" "$ENDERECO/$ARQUIVO"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "$ENDERECO/checksums.txt"
          # Só roda o executável se ele for o mesmo que o PocketBase publicou.
          (cd "$RUNNER_TEMP" && grep " $ARQUIVO\$" checksums.txt | sha256sum -c -)
          unzip -q -o "$RUNNER_TEMP/$ARQUIVO" pocketbase -d "$RUNNER_TEMP/pb"
          node pocketbase/testar-regras.mjs "$RUNNER_TEMP/pb/pocketbase"
      # Sobe o servidor de teste (pocketbase/servidor-de-teste.mjs) e roda contra ele os testes do app que
      # precisam de um PocketBase de verdade: os arquivos que terminam em .servidor.test.ts. No npm test
      # comum, sem a variável DISCORDVTT_SERVIDOR_TESTE, eles são pulados.
      - name: Testar o app com o servidor de teste
        run: |
          LOG="$RUNNER_TEMP/servidor-de-teste.log"
          node ../pocketbase/servidor-de-teste.mjs "$RUNNER_TEMP/pb/pocketbase" --porta=8092 > "$LOG" 2>&1 &
          for i in $(seq 1 60); do
            grep -q "Servidor de teste pronto." "$LOG" && break
            sleep 0.5
          done
          if ! grep -q "Servidor de teste pronto." "$LOG"; then cat "$LOG"; exit 1; fi
          DISCORDVTT_SERVIDOR_TESTE=http://127.0.0.1:8092 npx vitest run .servidor.test.ts
