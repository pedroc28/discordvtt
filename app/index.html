<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor de fichas</title>
    <script>
      // Aplica o tema salvo antes do app carregar, para a tela não piscar clara.
      try {
        var a = JSON.parse(localStorage.getItem('fichas:aparencia') || '{}')
        var t = a.tema || 'sistema'
        if (t === 'escuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.dataset.tema = 'escuro'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
