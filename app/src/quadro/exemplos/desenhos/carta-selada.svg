<svg xmlns="http://www.w3.org/2000/svg" width="860" height="600" viewBox="0 0 860 600">
  <defs>
    <filter id="fibras" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="r"/>
      <feColorMatrix in="r" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.42  0 0 0 0 0.3  0 0 0 0.25 0" result="f"/>
      <feComposite in="f" in2="SourceGraphic" operator="in" result="d"/>
      <feBlend in="d" in2="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="cera" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="9" result="r"/>
      <feDisplacementMap in="SourceGraphic" in2="r" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="brilhoCera" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#d9295f"/>
      <stop offset="0.6" stop-color="#a3123f"/>
      <stop offset="1" stop-color="#6e0a29"/>
    </radialGradient>
  </defs>
  <rect x="40" y="40" width="780" height="520" rx="4" fill="#efe6cf" filter="url(#fibras)" stroke="#b9a77d" stroke-width="2"/>
  <path d="M40 40 L430 330 L820 40" fill="#e6dbbe" stroke="#b9a77d" stroke-width="2" filter="url(#fibras)"/>
  <path d="M40 560 L340 300 M820 560 L520 300" fill="none" stroke="#c9b88f" stroke-width="2"/>
  <g fill="none" stroke="#3d3326" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M300 430 c20 -14 30 6 46 -4 s28 -10 44 2 s30 -6 50 -2 s34 8 60 -4"/>
    <path d="M330 470 c18 -10 34 4 52 -4 s36 -6 58 2 s30 -8 46 -2"/>
    <path d="M360 510 c14 -8 26 2 40 -2 s24 -4 40 2"/>
  </g>
  <g filter="url(#cera)">
