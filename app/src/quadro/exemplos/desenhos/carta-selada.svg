  </g>
  <circle cx="430" cy="330" r="42" fill="none" stroke="#6e0a29" stroke-width="4"/>
  <path d="M430 300 l9 20 h21 l-17 13 l7 21 l-20 -13 l-20 13 l7 -21 l-17 -13 h21 Z" fill="#6e0a29"/>
