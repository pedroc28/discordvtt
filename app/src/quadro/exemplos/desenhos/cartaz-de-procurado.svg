<svg xmlns="http://www.w3.org/2000/svg" width="600" height="820" viewBox="0 0 600 820">
  <defs>
    <filter id="velho" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" seed="6" result="r"/>
      <feColorMatrix in="r" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.36  0 0 0 0 0.16  0 0 0 1.3 -0.45" result="m"/>
      <feComposite in="m" in2="SourceGraphic" operator="in" result="d"/>
      <feBlend in="d" in2="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="rasgado" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="2" result="r"/>
      <feDisplacementMap in="SourceGraphic" in2="r" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rasgado)"><rect x="24" y="20" width="552" height="780" fill="#e4cf9c" filter="url(#velho)"/></g>
